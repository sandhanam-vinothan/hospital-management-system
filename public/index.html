<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a1c2b"><title>MediCare HMS</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:linear-gradient(135deg,#0a1c2b,#0e3a4a 60%,#0b2a3a);color:#e8f3f7;min-height:100vh}
#app{display:flex;min-height:100vh}aside{width:210px;padding:16px;background:rgba(255,255,255,.06);backdrop-filter:blur(14px);border-right:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:8px}
aside h3{margin:0 0 8px}nav{display:flex;flex-direction:column;gap:4px;flex:1}nav a{padding:10px 12px;border-radius:10px;cursor:pointer;color:#bcd}nav a:hover,nav a.on{background:rgba(45,212,191,.18);color:#fff}
.who{font-size:13px}main{flex:1;padding:20px;min-width:0}h2{margin:0}.bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.bar h2{flex:1}
input,select,textarea{width:100%;padding:10px;margin:4px 0 10px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);color:#fff;font:inherit}.bar input{width:200px;margin:0}
option{color:#000}button{padding:10px 16px;border:0;border-radius:10px;background:#14b8a6;color:#04201c;font-weight:600;cursor:pointer}button.g{background:rgba(255,255,255,.15);color:#fff}
.sc{overflow-x:auto;border-radius:14px;background:rgba(255,255,255,.06)}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,.08);white-space:nowrap}th{color:#7dd3c8}
.act a{cursor:pointer;margin-right:8px}.warn{color:#fbbf24}.er{color:#fca5a5;min-height:18px;font-size:14px}.tag{padding:2px 8px;border-radius:8px;background:rgba(255,255,255,.12)}.Paid,.Completed{background:#14532d}.Cancelled{background:#7f1d1d}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:16px}.stat{padding:18px;border-radius:16px;background:rgba(255,255,255,.08);display:flex;flex-direction:column;gap:6px}.stat b{font-size:28px;color:#5eead4}
.card{margin:auto;width:min(360px,92vw);padding:28px;border-radius:20px;background:rgba(255,255,255,.08);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.15)}.card h1{margin:0 0 4px}.card button{width:100%}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;overflow:auto;padding:16px}.card2{margin:auto;width:min(420px,100%);padding:22px;border-radius:18px;background:#0e2a38;border:1px solid rgba(255,255,255,.15)}.card2 button{margin-right:8px}label{font-size:13px;color:#9bc}
@media(max-width:700px){#app{flex-direction:column}aside{width:auto;flex-direction:row;flex-wrap:wrap;align-items:center}nav{flex-direction:row;flex-wrap:wrap}}
</style></head><body><div id="app"></div><div id="modal"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOK=sessionStorage.getItem('t'),U=null,REF={},ROWS={},K='';const O=a=>a.split(',');
const M={
patients:{t:'Patients',w:'admin,reception',f:[['name','Name'],['age','Age','number'],['gender','Gender','select',O('Male,Female,Other')],['phone','Phone (10 digits)'],['address','Address']]},
appointments:{t:'Appointments',w:'admin,reception',f:[['patientId','Patient','ref','patients'],['doctor','Doctor','ref','doctors'],['date','Date','date'],['time','Time','time'],['status','Status','select',O('Booked,Completed,Cancelled')]]},
records:{t:'Medical Records',w:'doctor',f:[['patientId','Patient','ref','patients'],['diagnosis','Diagnosis','text'],['treatment','Treatment','text'],['medicineId','Prescribed medicine','ref','medicines'],['qty','Quantity','number']]},
medicines:{t:'Medicines',w:'admin,pharmacist',f:[['name','Name'],['stock','Stock','number'],['price','Price ₹','number'],['expiry','Expiry','date']]},
bills:{t:'Billing',w:'admin,reception',f:[['patientId','Patient','ref','patients'],['consultation','Consultation ₹','number'],['medicine','Medicines ₹','number'],['other','Other ₹','number'],['discount','Discount ₹','number'],['taxPct','Tax %','number'],['status','Status','select',O('Unpaid,Paid')]]},
users:{t:'Staff',w:'admin',f:[['name','Name'],['email','Email'],['role','Role','select',O('admin,doctor,reception,pharmacist')],['active','Active','select',O('true,false')],['password','Password','password']]}};
const MENU={admin:['dash','patients','appointments','medicines','bills','users','audit'],reception:['patients','appointments','bills'],doctor:['appointments','patients','records'],pharmacist:['medicines','rx']},TT={dash:'Dashboard',rx:'Prescriptions',audit:'Audit Log'};
async function api(u,m='GET',b){const r=await fetch('/api/'+u,{method:m,headers:{'content-type':'application/json',authorization:'Bearer '+TOK},body:b?JSON.stringify(b):undefined}),j=await r.json().catch(()=>({}));if(r.status===401&&TOK)logout();if(!r.ok)throw new Error(j.error||'Error');return j}
function logout(){sessionStorage.clear();TOK=null;U=null;login()}
function login(){$('#app').innerHTML=`<div class=card><h1>🏥 Medi<b style="color:#5eead4">Care</b> HMS</h1><p>Hospital Management System</p><input id=e placeholder="Email" autocomplete=username><input id=p type=password placeholder="Password" autocomplete=current-password onkeydown="event.key==='Enter'&&doLogin()"><button onclick=doLogin()>Sign In</button><div id=er class=er></div><small>Demo: admin@hospital.local / Admin@123<br>(also doctor@ / reception@ / pharmacy@ — see README)</small></div>`}
async function doLogin(){try{const r=await api('login','POST',{email:$('#e').value,password:$('#p').value});TOK=r.token;U=r.user;sessionStorage.setItem('t',TOK);start()}catch(x){$('#er').textContent=x.message}}
async function refs(){for(const k of['patients','doctors','medicines'])try{REF[k]=await api(k)}catch{REF[k]=[]}}
async function start(){try{U=(await api('me')).user}catch{return login()}
 $('#app').innerHTML=`<aside><h3>🏥 MediCare</h3><nav>${MENU[U.role].map(k=>`<a id=n_${k} onclick="go('${k}')">${TT[k]||M[k].t}</a>`).join('')}</nav><div class=who>${esc(U.name)}<br><small>${U.role}</small><br><button class=g onclick=logout()>Sign out</button></div></aside><main id=main></main>`;go(MENU[U.role][0])}
async function go(k){K=k;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.id==='n_'+k));$('#main').innerHTML='Loading…';try{await({dash,rx,audit}[k]||(()=>table(k)))()}catch(x){$('#main').innerHTML='<p class=er>'+esc(x.message)+'</p>'}}
const nm=(l,i)=>((REF[l]||[]).find(x=>x.id===i)||{}).name||'';
function cell(k,f,v){const t=f[2],n=f[0];if(t==='ref')return esc(nm(f[3],v)||'—');if(k==='medicines'&&n==='stock'&&v<=10)return`<b class=warn>${esc(v)} ⚠ low</b>`;if(k==='medicines'&&n==='expiry'&&v<new Date(Date.now()+90*864e5).toISOString().slice(0,10))return`<b class=warn>${esc(v)} ⚠</b>`;if(n==='status')return`<span class="tag ${esc(v)}">${esc(v)}</span>`;return esc(v)}
async function table(k){await refs();const m=M[k],can=m.w.split(',').includes(U.role),rows=ROWS[k]=await api(k),fs=m.f.filter(f=>f[0]!=='password');
 $('#main').innerHTML=`<div class=bar><h2>${m.t}</h2><input placeholder="Search…" oninput="flt(this.value)">${can?`<button onclick="form('${k}')">+ Add</button>`:''}</div><div class=sc><table><thead><tr>${fs.map(f=>`<th>${f[1]}</th>`).join('')}${k==='bills'?'<th>Total</th>':''}<th></th></tr></thead><tbody>${rows.map(r=>`<tr>${fs.map(f=>`<td>${cell(k,f,r[f[0]])}</td>`).join('')}${k==='bills'?`<td>₹${r.total}</td>`:''}<td class=act>${k==='bills'?`<a onclick="pr('${r.id}')">🖨</a>`:''}${can?`<a onclick="form('${k}','${r.id}')">✏️</a><a onclick="del('${k}','${r.id}')">🗑</a>`:''}</td></tr>`).join('')||'<tr><td colspan=9>No data yet</td></tr>'}</tbody></table></div>`}
const flt=v=>document.querySelectorAll('tbody tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(v.toLowerCase())?'':'none');
function form(k,id){const m=M[k],r=id?ROWS[k].find(x=>x.id===id):{};
 const inp=f=>{const[n,l,t,o]=f,v=r[n]??'';if(t==='select')return`<select id=f_${n}>${o.map(x=>`<option ${String(v)===x?'selected':''}>${x}</option>`).join('')}</select>`;
  if(t==='ref')return`<select id=f_${n}>${n==='medicineId'?'<option value="">— none —</option>':''}${(REF[o]||[]).map(x=>`<option value="${esc(x.id)}" ${x.id===v?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`;
  if(t==='text')return`<textarea id=f_${n}>${esc(v)}</textarea>`;return`<input id=f_${n} type=${t||'text'} value="${esc(v)}" ${t==='number'?'step=any min=0':''} ${n==='password'?`placeholder="${id?'leave blank to keep':'min 8 characters'}"`:''}>`};
 $('#modal').innerHTML=`<div class=ov><div class=card2><h3>${id?'Edit':'Add'} — ${m.t}</h3>${m.f.map(f=>`<label>${f[1]}</label>${inp(f)}`).join('')}<div id=fe class=er></div><button onclick="save('${k}','${id||''}')">Save</button><button class=g onclick=cl()>Cancel</button></div></div>`}
const cl=()=>$('#modal').innerHTML='';
async function save(k,id){const b={};M[k].f.forEach(f=>b[f[0]]=$('#f_'+f[0]).value);if(k==='users'&&id&&!b.password)delete b.password;try{await api(id?k+'/'+id:k,id?'PUT':'POST',b);cl();go(K)}catch(x){$('#fe').textContent=x.message}}
async function del(k,id){if(!confirm('Delete this record?'))return;try{await api(k+'/'+id,'DELETE');go(K)}catch(x){alert(x.message)}}
async function dash(){const s=await api('stats');$('#main').innerHTML=`<h2>Dashboard</h2><div class=grid>${[['Patients',s.patients],['Appointments today',s.today],['Revenue (paid)','₹'+s.revenue],['Unpaid bills',s.unpaid],['Low stock items',s.low],['Expiring in 90 days',s.expiring]].map(x=>`<div class=stat><b>${esc(x[1])}</b><span>${x[0]}</span></div>`).join('')}</div>`}
async function rx(){const L=await api('prescriptions');$('#main').innerHTML=`<h2>Prescriptions</h2><br><div class=sc><table><thead><tr><th>Patient</th><th>Medicine</th><th>Qty</th><th>Status</th><th></th></tr></thead><tbody>${L.map(r=>`<tr><td>${esc(r.patient)}</td><td>${esc(r.medicine)}</td><td>${esc(r.qty)}</td><td>${r.dispensed?'✅ Dispensed':'⏳ Pending'}</td><td>${!r.dispensed&&U.role==='pharmacist'?`<button onclick="disp('${r.id}')">Dispense</button>`:''}</td></tr>`).join('')||'<tr><td colspan=5>No prescriptions yet</td></tr>'}</tbody></table></div>`}
async function disp(i){try{await api('dispense','POST',{id:i});go('rx')}catch(x){alert(x.message)}}
async function audit(){const L=await api('audit');$('#main').innerHTML=`<h2>Audit Log</h2><br><div class=sc><table><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Module</th></tr></thead><tbody>${L.map(r=>`<tr><td>${new Date(r.at).toLocaleString()}</td><td>${esc(r.name)}</td><td>${esc(r.a)}</td><td>${esc(r.c)}</td></tr>`).join('')||'<tr><td colspan=4>Nothing yet</td></tr>'}</tbody></table></div>`}
function pr(i){const b=ROWS.bills.find(x=>x.id===i),w=open('','_blank');if(!w)return alert('Please allow popups to print');
 w.document.write(`<title>Invoice</title><body style="font-family:sans-serif;max-width:480px;margin:30px auto"><h2>🏥 MediCare Hospital — Invoice</h2><p>Patient: ${esc(nm('patients',b.patientId))}<br>Date: ${new Date(b.at).toLocaleDateString()}<br>Status: ${esc(b.status)}</p><table width=100% cellpadding=6><tr><td>Consultation</td><td align=right>₹${b.consultation}</td></tr><tr><td>Medicines</td><td align=right>₹${b.medicine}</td></tr><tr><td>Other</td><td align=right>₹${b.other}</td></tr><tr><td>Discount</td><td align=right>-₹${b.discount}</td></tr><tr><td>Tax</td><td align=right>${b.taxPct}%</td></tr><tr><td><b>Total</b></td><td align=right><b>₹${b.total}</b></td></tr></table>`);w.document.close();w.print()}
TOK?start():login();
</script></body></html>
