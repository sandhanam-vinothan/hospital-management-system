<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MediCare HMS</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,sans-serif;background:#f4f8fb;color:#17243a}button,input,select,textarea{font:inherit}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eefbff,#f6f4ff)}.loginbox{width:min(430px,92vw);background:#fff;padding:34px;border-radius:24px;box-shadow:0 24px 70px #24415b20}.brand{font-size:25px;font-weight:800}.brand i{color:#19a99b;font-style:normal}.muted{color:#728097}.field{width:100%;padding:13px 14px;border:1px solid #dbe4ec;border-radius:12px;margin:7px 0;background:#fff}.btn{border:0;border-radius:12px;padding:12px 16px;background:#147d8f;color:white;font-weight:700;cursor:pointer}.btn.secondary{background:#edf3f6;color:#355064}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{background:#fff;border-right:1px solid #e5edf3;padding:22px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.nav{margin-top:28px;display:grid;gap:6px}.nav button{border:0;background:transparent;text-align:left;padding:11px 13px;border-radius:11px;color:#607084;cursor:pointer}.nav button.on,.nav button:hover{background:#e9f8f7;color:#087e76;font-weight:700}.profile{margin-top:auto;padding:14px;background:#f5f8fa;border-radius:14px}.main{min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid #e5edf3;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.content{padding:28px;max-width:1500px;margin:auto}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.hero h1{margin:0 0 5px}.grid{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:14px}.stat{background:#fff;border:1px solid #e6edf2;border-radius:17px;padding:18px;box-shadow:0 8px 30px #38536b08}.stat b{display:block;font-size:26px;color:#0e807b}.stat span{color:#718094;font-size:13px}.panel{background:#fff;border:1px solid #e6edf2;border-radius:18px;padding:20px;margin-top:18px;box-shadow:0 8px 30px #38536b08}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.bar h2{margin:0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:13px 12px;border-bottom:1px solid #edf1f4;text-align:left;font-size:14px}th{color:#718094;font-size:12px;text-transform:uppercase}.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:#edf5f5;color:#087e76}.cards2{display:grid;grid-template-columns:2fr 1fr;gap:18px}.modal{position:fixed;inset:0;background:#17243a66;display:grid;place-items:center;z-index:20;padding:20px}.modalbox{background:#fff;width:min(560px,96vw);max-height:90vh;overflow:auto;border-radius:20px;padding:22px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid .full{grid-column:1/-1}.error{color:#c33;margin-top:8px}@media(max-width:1050px){.grid{grid-template-columns:repeat(3,1fr)}.cards2{grid-template-columns:1fr}}@media(max-width:760px){.app{grid-template-columns:1fr}.side{height:auto;position:static;border-right:0}.nav{grid-template-columns:repeat(2,1fr);margin-top:14px}.profile{margin-top:14px}.top{padding:0 16px}.content{padding:18px}.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}}
</style></head><body><div id="root"></div><div id="modalroot"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let TOK=sessionStorage.getItem("hms_token"),U=null;
async function api(p,m="GET",b){let r=await fetch("/api/"+p,{method:m,headers:{"content-type":"application/json",authorization:"Bearer "+(TOK||"")},body:b?JSON.stringify(b):undefined}),j=await r.json().catch(()=>({}));if(r.status===401&&p!=="login"){sessionStorage.clear();TOK=null;login()}if(!r.ok)throw Error(j.error||"Request failed");return j}
const menus={admin:[["dashboard","Dashboard"],["patients","Patients"],["appointments","Appointments"],["doctors","Doctors"],["medicines","Pharmacy"],["bills","Billing"],["users","Staff & Accounts"],["audit","Audit Log"]],patient:[["patienthome","Home"],["appointments","My Appointments"],["records","Medical Records"],["prescriptions","Prescriptions"],["bills","Bills"]],doctor:[["doctorhome","Dashboard"],["appointments","Appointments"],["patients","Patients"],["records","Medical Records"],["prescriptions","Prescriptions"]],pharmacy:[["pharmacyhome","Dashboard"],["prescriptions","Prescriptions"],["medicines","Medicines"]],reception:[["patients","Patients"],["appointments","Appointments"],["bills","Billing"]]};
function login(){document.body.innerHTML=`<div class=login><div class=loginbox><div class=brand>🏥 Medi<i>Care</i></div><h1>Welcome back</h1><p class=muted>Sign in to your hospital workspace.</p><input class=field id=email placeholder="Email"><input class=field id=password type=password placeholder="Password"><button class=btn style="width:100%;margin-top:8px" onclick=doLogin()>Sign in</button><div id=err class=error></div></div></div>`}
async function doLogin(){try{let x=await api("login","POST",{email:$("#email").value,password:$("#password").value});TOK=x.token;sessionStorage.setItem("hms_token",TOK);start()}catch(e){$("#err").textContent=e.message}}
async function start(){try{U=(await api("me")).user}catch{return login()}document.body.innerHTML=`<div class=app><aside class=side><div class=brand>🏥 Medi<i>Care</i></div><div class=nav>${menus[U.role].map((x,i)=>`<button id=n_${x[0]} onclick="go('${x[0]}')">${x[1]}</button>`).join("")}</div><div class=profile><b>${esc(U.name)}</b><div class=muted>${esc(U.role)}</div><button class="btn secondary" style="margin-top:10px" onclick=logout()>Sign out</button></div></aside><section class=main><header class=top><b>Hospital Management System</b><span>${esc(U.name)} · ${esc(U.role)}</span></header><main class=content id=content></main></section></div><div id=modalroot></div>`;go(menus[U.role][0][0])}
function logout(){sessionStorage.clear();location.reload()}function on(k){document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("on",x.id==="n_"+k))}
async function go(k){on(k);$("#content").innerHTML="<p class=muted>Loading…</p>";try{if(k==="dashboard")return dashboard();if(k==="patienthome")return patientHome();if(k==="doctorhome")return doctorHome();if(k==="pharmacyhome")return pharmacyHome();return list(k)}catch(e){$("#content").innerHTML=`<div class=panel><b>${esc(e.message)}</b></div>`}}
const title=k=>({patients:"Patients",appointments:"Appointments",doctors:"Doctors",medicines:"Pharmacy Inventory",bills:"Billing",users:"Staff & Accounts",audit:"Audit Log",records:"Medical Records",prescriptions:"Prescriptions"}[k]||k);
async function dashboard(){let s=await api("stats"),a=await api("appointments");$("#content").innerHTML=`<div class=hero><div><h1>Good day, ${esc(U.name.split(" ")[0])}</h1><div class=muted>Here is your hospital overview.</div></div><button class=btn onclick="go('appointments')">View appointments</button></div><div class=grid>${[["Patients",s.patients],["Today",s.today],["Doctors",s.doctors],["Revenue","₹"+s.revenue],["Unpaid",s.unpaid],["Low stock",s.low]].map(x=>`<div class=stat><b>${esc(x[1])}</b><span>${x[0]}</span></div>`).join("")}</div><div class=cards2><div class=panel><div class=bar><h2>Recent appointments</h2></div>${table(a.slice(0,7),["patient_name","doctor_name","appointment_date","appointment_time","status"])}</div><div class=panel><h2>Quick actions</h2><p class=muted>Manage the hospital from one place.</p><button class=btn onclick="add('patients')">+ Patient</button> <button class="btn secondary" onclick="add('users')">+ Account</button></div></div>`}
async function patientHome(){let a=await api("appointments"),p=await api("prescriptions"),b=await api("bills");$("#content").innerHTML=`<div class=hero><div><h1>Welcome, ${esc(U.name)}</h1><div class=muted>Your appointments and care information.</div></div><button class=btn onclick="add('appointments')">Book appointment</button></div><div class=grid>${[["Appointments",a.length],["Prescriptions",p.length],["Bills",b.length]].map(x=>`<div class=stat><b>${x[1]}</b><span>${x[0]}</span></div>`).join("")}</div>`}
async function doctorHome(){let a=await api("appointments"),p=await api("patients");$("#content").innerHTML=`<div class=hero><div><h1>Doctor Dashboard</h1><div class=muted>${esc(U.name)}</div></div></div><div class=grid><div class=stat><b>${a.length}</b><span>Appointments</span></div><div class=stat><b>${p.length}</b><span>Patients</span></div></div>`}
async function pharmacyHome(){let m=await api("medicines"),p=await api("prescriptions"),low=m.filter(x=>+x.quantity<=10);$("#content").innerHTML=`<div class=hero><div><h1>Pharmacy Dashboard</h1><div class=muted>Inventory and prescriptions.</div></div><button class=btn onclick="add('medicines')">+ Medicine</button></div><div class=grid><div class=stat><b>${m.length}</b><span>Medicines</span></div><div class=stat><b>${low.length}</b><span>Low stock</span></div><div class=stat><b>${p.length}</b><span>Prescriptions</span></div></div>`}
function table(rows,cols){if(!rows.length)return`<p class=muted>No data yet.</p>`;return`<div class=tablewrap><table><thead><tr>${cols.map(c=>`<th>${c.replaceAll("_"," ")}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c==="status"||c==="payment_status"?`<span class=tag>${esc(r[c])}</span>`:esc(r[c])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
async function list(k){let rows=await api(k),cols={patients:["patient_code","name","phone","gender","blood_group"],appointments:["patient_name","doctor_name","appointment_date","appointment_time","status"],doctors:["name","specialization","phone","email"],medicines:["name","batch_number","quantity","unit_price","expiry_date"],bills:["patient_name","amount","payment_status","payment_method","created_at"],users:["name","email","role","phone","active"],audit:["created_at","user_name","action","entity_type"],records:["patient_name","doctor_name","diagnosis","treatment","created_at"],prescriptions:["patient_name","doctor_name","notes","status","created_at"]}[k];let can=(k==="patients"&&["admin","reception"].includes(U.role))||(k==="appointments"&&["admin","reception","patient"].includes(U.role))||(k==="medicines"&&["admin","pharmacy"].includes(U.role))||(k==="users"&&U.role==="admin");$("#content").innerHTML=`<div class=hero><div><h1>${title(k)}</h1><div class=muted>${rows.length} record${rows.length===1?"":"s"}</div></div>${can?`<button class=btn onclick="add('${k}')">+ Add</button>`:""}</div><div class=panel>${table(rows,cols)}</div>`}
async function add(k){let docs=[],patients=[];try{docs=await api("doctors")}catch{}try{patients=await api("patients")}catch{};let f="";
if(k==="patients")f=`<input class=field id=f_name placeholder="Patient name"><input class=field id=f_email placeholder="Email"><input class=field id=f_phone placeholder="Phone"><select class=field id=f_gender><option value="">Gender</option><option>Male</option><option>Female</option><option>Other</option></select><input class=field id=f_blood placeholder="Blood group"><textarea class="field full" id=f_address placeholder="Address"></textarea>`;
if(k==="users")f=`<input class=field id=f_name placeholder="Name"><input class=field id=f_email placeholder="Email"><input class=field id=f_phone placeholder="Phone"><select class=field id=f_role><option>patient</option><option>doctor</option><option>pharmacy</option><option>reception</option><option>admin</option></select><input class=field id=f_spec placeholder="Specialization (doctor only)"><input class=field id=f_password type=password placeholder="Password (8+ characters)">`;
if(k==="appointments")f=`${U.role==="patient"?"":`<select class=field id=f_patient><option value="">Patient</option>${patients.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select>`}<select class=field id=f_doctor><option value="">Doctor</option>${docs.map(x=>`<option value="${x.id}">${esc(x.name)}${x.specialization?" · "+esc(x.specialization):""}</option>`).join("")}</select><input class=field id=f_date type=date><input class=field id=f_time type=time><textarea class="field full" id=f_reason placeholder="Reason"></textarea>`;
if(k==="medicines")f=`<input class=field id=f_name placeholder="Medicine name"><input class=field id=f_generic placeholder="Generic name"><input class=field id=f_batch placeholder="Batch number"><input class=field id=f_qty type=number placeholder="Quantity"><input class=field id=f_price type=number step=.01 placeholder="Unit price"><input class=field id=f_expiry type=date><input class="field full" id=f_supplier placeholder="Supplier">`;
$("#modalroot").innerHTML=`<div class=modal><div class=modalbox><div class=bar><h2>Add ${title(k)}</h2><button class="btn secondary" onclick=closeModal()>Close</button></div><div class=formgrid>${f}</div><div id=formerr class=error></div><button class=btn style="margin-top:12px" onclick="save('${k}')">Save</button></div></div>`}
function closeModal(){$("#modalroot").innerHTML=""}
async function save(k){try{let b={};if(k==="patients")b={name:$("#f_name").value,email:$("#f_email").value,phone:$("#f_phone").value,gender:$("#f_gender").value,blood_group:$("#f_blood").value,address:$("#f_address").value};if(k==="users")b={name:$("#f_name").value,email:$("#f_email").value,phone:$("#f_phone").value,role:$("#f_role").value,specialization:$("#f_spec").value,password:$("#f_password").value};if(k==="appointments")b={patient_id:$("#f_patient")?.value,doctor_id:$("#f_doctor").value,date:$("#f_date").value,time:$("#f_time").value,reason:$("#f_reason").value};if(k==="medicines")b={name:$("#f_name").value,generic_name:$("#f_generic").value,batch_number:$("#f_batch").value,quantity:$("#f_qty").value,unit_price:$("#f_price").value,expiry_date:$("#f_expiry").value,supplier:$("#f_supplier").value};await api(k,"POST",b);closeModal();go(k)}catch(e){$("#formerr").textContent=e.message}}
TOK?start():login();
</script></body></html>
